<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graduation Celebration</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Montserrat', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
    color: #FFD700;
    margin: 0;
    padding: 0;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    margin: 50px 0 20px;
    text-shadow: 2px 2px 8px #000;
  }

  #form {
    margin-bottom: 40px;
  }

  input#gradNumber {
    font-size: 1.3rem;
    padding: 12px 20px;
    width: 220px;
    border-radius: 12px;
    border: 2px solid #FFD700;
    background: #222;
    color: #FFD700;
    text-align: center;
    transition: 0.3s;
  }

  input#gradNumber:focus {
    outline: none;
    box-shadow: 0 0 10px #FFD700;
    border-color: #FFD700;
  }

  button {
    font-size: 1.3rem;
    padding: 12px 30px;
    margin-left: 10px;
    border-radius: 12px;
    border: 2px solid #FFD700;
    background: #222;
    color: #FFD700;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #FFD700;
    color: #1a1a1a;
    transform: scale(1.05);
  }

  #result {
    display: none;
    margin: 50px auto;
    max-width: 700px;
    background: #222;
    padding: 40px 20px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
  }

  #congrats {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    margin-bottom: 30px;
    text-shadow: 2px 2px 8px #000;
  }

  #photo {
    width: 320px;
    height: 320px;
    object-fit: cover;
    margin: 20px 0;
    border: 5px solid #FFD700;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  .message-box, .verse-box {
    font-size: 1.8rem;
    margin: 20px auto;
    padding: 20px;
    width: 85%;
    max-width: 600px;
    border-radius: 25px;
    background: #1f1f1f;
    border: 2px solid #FFD700;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .verse-box {
    background: #292929;
  }

  @media (max-width: 768px) {
    #photo {
      width: 250px;
      height: 250px;
    }
    #congrats {
      font-size: 2rem;
    }
    .message-box, .verse-box {
      font-size: 1.4rem;
      padding: 15px;
    }
    input#gradNumber, button {
      font-size: 1.1rem;
      padding: 10px 15px;
    }
  }
</style>
</head>
<body>

<h1>Graduation Celebration 🎓</h1>

<div id="form">
  <input type="text" id="gradNumber" placeholder="Enter your graduation number">
  <button onclick="celebrate()">Celebrate!</button>
</div>

<div id="result">
  <h2 id="congrats"></h2>
  <img id="photo" src="" alt="Graduate Photo">
  <div class="message-box" id="message"></div>
  <div class="verse-box" id="verse"></div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
let graduates = [];
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv3eBxRi0Cc-uxihd_f-09r4mobnoM88hLNiPccq05WiSnis4pIkV--ajRcoA2g4BgsAlGR8uS5JAd/pub?output=csv";

Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
        graduates = results.data.map(g => ({
            number: g.number.trim(),
            firstName: g.first_name.trim(),
            image: g.image_url.trim(),
            message: g.message.trim(),
            verse: g.verse.trim()
        }));
        console.log("Graduates loaded:", graduates);
    },
    error: function(err) {
        alert("Failed to load graduation data");
        console.error(err);
    }
});

function celebrate() {
    const input = document.getElementById("gradNumber").value.trim();
    const grad = graduates.find(g => g.number === input);
    if(!grad) {
        alert("Graduation number not found ❌");
        return;
    }

    document.getElementById("form").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("congrats").innerText = `Congratulations, ${grad.firstName}!`;
    document.getElementById("photo").src = grad.image;
    document.getElementById("message").innerText = grad.message;
    document.getElementById("verse").innerText = grad.verse;

    const music = document.getElementById("music");
    music.play();
}
</script>
</body>
</html>
