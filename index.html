<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graduation Celebration</title>
<style>
body { font-family:'Georgia', serif; text-align:center; background:#1a1a1a; color:#FFD700; margin:0; padding:0;}
h1 { font-size:3rem; margin-top:50px; text-shadow:2px 2px 5px black;}
#form { margin-top:50px; }
input#gradNumber { font-size:1.5rem; padding:10px; width:200px; border-radius:8px; border:2px solid #FFD700; background:#333; color:#FFD700; text-align:center; }
button { font-size:1.5rem; padding:10px 25px; margin-left:10px; border-radius:8px; border:2px solid #FFD700; background:#333; color:#FFD700; cursor:pointer; transition:0.2s; }
button:hover { background:#FFD700; color:#1a1a1a; }
#result { display:none; margin-top:50px; }
#congrats { font-size:3rem; text-shadow:2px 2px 5px black; margin-bottom:30px;}
#photo { width:300px; height:300px; object-fit:cover; margin:30px 0; border:5px solid #FFD700;}
.message-box, .verse-box { font-size:2rem; margin:15px auto; padding:20px; width:80%; max-width:600px; border-radius:20px; background:#333; border:2px solid #FFD700; box-shadow:2px 2px 10px black;}
</style>
</head>
<body>

<h1>Graduation Celebration 🎓</h1>

<div id="form">
<input type="text" id="gradNumber" placeholder="Enter your graduation number">
<button onclick="celebrate()">Celebrate!</button>
</div>

<div id="result">
<h2 id="congrats"></h2>
<img id="photo" src="" alt="Graduate Photo">
<div class="message-box" id="message"></div>
<div class="verse-box" id="verse"></div>
</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Include PapaParse -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
let graduates = [];
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv3eBxRi0Cc-uxihd_f-09r4mobnoM88hLNiPccq05WiSnis4pIkV--ajRcoA2g4BgsAlGR8uS5JAd/pub?output=csv";

// ===== Fetch and parse CSV safely =====
Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
        graduates = results.data.map(g => ({
            number: g.number.trim(),
            firstName: g.first_name.trim(),
            image: g.image_url.trim(),
            message: g.message.trim(),
            verse: g.verse.trim()
        }));
        console.log("Graduates loaded:", graduates);
    },
    error: function(err) {
        alert("Failed to load graduation data");
        console.error(err);
    }
});

// ===== Celebrate function =====
function celebrate() {
    const input = document.getElementById("gradNumber").value.trim();
    const grad = graduates.find(g => g.number === input);
    if(!grad) {
        alert("Graduation number not found ❌");
        return;
    }

    document.getElementById("form").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("congrats").innerText = `Congratulations, ${grad.firstName}!`;
    document.getElementById("photo").src = grad.image;
    document.getElementById("message").innerText = grad.message;
    document.getElementById("verse").innerText = grad.verse;

    const music = document.getElementById("music");
    music.play();
}
</script>
</body>
</html>
