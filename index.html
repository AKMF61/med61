<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Celebration 🎓</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
/* ===== FIX MOBILE WHITE SPACE ===== */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}

/* ===== BODY ===== */
body {
  font-family: 'Montserrat', sans-serif;
  text-align: center;
  background: url("https://raw.githubusercontent.com/AKMF61/med61/refs/heads/main/%E2%80%94Pngtree%E2%80%94graduation%20golden%20and%20premium%20black_2497013.jpg") center center no-repeat;
background-size: cover;
background-attachment: scroll;


  color: #FFD700;
}

/* ===== TITLE ===== */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  margin: 40px 16px 20px;
  text-shadow: 2px 2px 8px #000;
}

/* ===== FORM ===== */
#form {
  padding: 0 16px;
}

input#gradNumber {
  font-size: 1.2rem;
  padding: 12px 16px;
  width: 100%;
  max-width: 260px;
  border-radius: 12px;
  border: 2px solid #FFD700;
  background: #111;
  color: #FFD700;
  text-align: center;
}

button {
  font-size: 1.2rem;
  padding: 12px 28px;
  margin-top: 12px;
  border-radius: 12px;
  border: 2px solid #FFD700;
  background: #111;
  color: #FFD700;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #FFD700;
  color: #000;
}

/* ===== WELCOME IMAGE ===== */
#welcomeImage {
  width: 100%;
  max-width: 900px;
  margin: 30px auto 0;
  border-radius: 18px;
  border: 3px solid #FFD700;
  box-shadow: 0 6px 18px rgba(0,0,0,0.7);
  display: block;
}

/* ===== RESULT CARD ===== */
#result {
  display: none;
  margin: 50px auto;
  width: calc(100% - 32px);
  max-width: 700px;
  background: #111;
  padding: 30px 20px;
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  opacity: 0;
  transform: translateY(40px);
  transition: all 1s ease;
}

#result.show {
  opacity: 1;
  transform: translateY(0);
}

#congrats {
  font-family: 'Playfair Display', serif;
  font-size: 2.6rem;
  margin-bottom: 20px;
}

/* ===== PHOTO ===== */
#photo {
  width: 100%;
  max-width: 320px;
  height: auto;
  object-fit: cover;
  margin: 20px auto;
  border: 4px solid #FFD700;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  display: block;
}

/* ===== MESSAGE & VERSE ===== */
.message-box,
.verse-box {
  font-size: 1.5rem;
  margin: 20px auto;
  padding: 20px;
  width: 100%;
  border-radius: 22px;
  background: #1a1a1a;
  border: 2px solid #FFD700;
}

/* ===== CONFETTI ===== */
canvas#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  h1 { font-size: 2.2rem; }
  #congrats { font-size: 2rem; }
  .message-box, .verse-box { font-size: 1.3rem; }
  body {
    background-position: top center;
    background-size: contain;
    background-repeat: no-repeat;
    background-color: #000; /* لون احتياطي */
  }
}
</style>
</head>

<body>

<h1>Graduation Celebration 🎓</h1>

<div id="form">
  <input type="text" id="gradNumber" placeholder="Enter your graduation number">
  <br>
  <button onclick="celebrate()">Celebrate 🎉</button>

  <img id="welcomeImage"
       src="https://raw.githubusercontent.com/AKMF61/med61/refs/heads/main/photo_%D9%A2%D9%A0%D9%A2%D9%A6-%D9%A0%D9%A1-%D9%A2%D9%A6_%D9%A0%D9%A1-%D9%A4%D9%A6-%D9%A0%D9%A9.jpg"
       alt="Welcome">
</div>

<div id="result">
  <h2 id="congrats"></h2>
  <img id="photo" src="">
  <div class="message-box" id="message"></div>
  <div class="verse-box" id="verse"></div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="confetti"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
let graduates = [];
const SHEET_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSv3eBxRi0Cc-uxihd_f-09r4mobnoM88hLNiPccq05WiSnis4pIkV--ajRcoA2g4BgsAlGR8uS5JAd/pub?output=csv";

/* ===== LOAD CSV ===== */
Papa.parse(SHEET_CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: res => {
    graduates = res.data.map(g => ({
      number: g.number?.trim(),
      firstName: g.first_name?.trim(),
      image: g.image_url?.trim(),
      message: g.message?.trim(),
      verse: g.verse?.trim()
    }));
  }
});

/* ===== CONFETTI ===== */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
let pieces = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function createConfetti() {
  pieces = [];
  const colors = ["#FFD700", "#FFC700", "#FFB700"];
  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 6 + 4,
      d: Math.random() * 50,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function drawConfetti() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p => {
    ctx.beginPath();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.r / 2;
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y + p.r);
    ctx.stroke();
    p.y += Math.cos(p.d) + 2;
    if (p.y > canvas.height) p.y = -10;
  });
}

function startConfetti() {
  createConfetti();
  setInterval(drawConfetti, 20);
}

/* ===== CELEBRATE ===== */
function celebrate() {
  const input = document.getElementById("gradNumber").value.trim();
  const grad = graduates.find(g => g.number === input);

  if (!grad) {
    alert("Graduation number not found ❌");
    return;
  }

  document.getElementById("form").style.display = "none";
  const result = document.getElementById("result");
  result.style.display = "block";
  setTimeout(() => result.classList.add("show"), 50);

  document.getElementById("congrats").innerText =
    `Congratulations ${grad.firstName} 🎓`;

  document.getElementById("photo").src = grad.image;
  document.getElementById("message").innerText = grad.message;
  document.getElementById("verse").innerText = grad.verse;

  document.getElementById("music").play();
  startConfetti();
}
</script>

</body>
</html>
