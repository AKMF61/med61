<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graduation Celebration</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f5f5f5; }
    #form { margin-top: 50px; }
    #result { display: none; margin-top: 30px; }
    #photo { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; margin: 20px 0; }
    canvas#confetti { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Graduation Celebration 🎓</h1>

  <div id="form">
    <input type="text" id="gradNumber" placeholder="Enter your graduation number">
    <button onclick="celebrate()">Celebrate!</button>
  </div>

  <div id="result">
    <h2 id="congrats"></h2>
    <img id="photo" src="" alt="Graduate Photo">
    <p id="message"></p>
    <p id="verse"></p>
  </div>

  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <canvas id="confetti"></canvas>

<script>
  // ===== Global variables =====
  let graduates = [];
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv3eBxRi0Cc-uxihd_f-09r4mobnoM88hLNiPccq05WiSnis4pIkV--ajRcoA2g4BgsAlGR8uS5JAd/pub?output=csv";

  // ===== Fetch CSV and parse =====
  fetch(SHEET_CSV_URL)
    .then(res => res.text())
    .then(text => {
      const rows = text.trim().split("\n");
      rows.slice(1).forEach(row => {
        const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        if(!cols) return;
        graduates.push({
          number: cols[0].replace(/"/g,'').trim(),
          firstName: cols[1].replace(/"/g,'').trim(),
          image: cols[2].replace(/"/g,'').trim(),
          message: cols[3].replace(/"/g,'').trim(),
          verse: cols[4].replace(/"/g,'').trim()
        });
      });
      console.log("Graduates loaded:", graduates);
    })
    .catch(err => {
      alert("Failed to load graduation data.");
      console.error(err);
    });

  // ===== Confetti Setup =====
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  let confettiInterval;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createConfetti() {
    confettiPieces = [];
    for (let i = 0; i < 150; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 50,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        tilt: Math.random() * 10
      });
    }
  }

  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces.forEach(p => {
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    updateConfetti();
  }

  function updateConfetti() {
    confettiPieces.forEach(p => {
      p.y += Math.cos(p.d) + 2 + p.r / 2;
      p.x += Math.sin(p.d);
      if (p.y > canvas.height) p.y = -10;
    });
  }

  function startConfetti() {
    createConfetti();
    confettiInterval = setInterval(drawConfetti, 20);
  }

  // ===== Celebrate Function =====
  function celebrate() {
    const input = document.getElementById("gradNumber").value.trim();
    const grad = graduates.find(g => g.number === input);
    if(!grad) {
      alert("Graduation number not found ❌");
      return;
    }

    document.getElementById("form").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("congrats").innerText = `Congratulations, ${grad.firstName}!`;
    document.getElementById("photo").src = grad.image;
    document.getElementById("message").innerText = grad.message;
    document.getElementById("verse").innerText = grad.verse;

    const music = document.getElementById("music");
    music.play();
    startConfetti();
  }
</script>

</body>
</html>
