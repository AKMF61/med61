<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Graduation Celebration</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  body {
  font-family: 'Montserrat', sans-serif;
    text-align: center;
    /* background: linear-gradient(135deg, #1a1a1a, #0d0d0d);  remove old background */
    background-image: url('https://raw.githubusercontent.com/AKMF61/med61/refs/heads/main/%E2%80%94Pngtree%E2%80%94graduation%20golden%20and%20premium%20black_2497013.jpg'); /* link to your image */
    background-size: cover;       /* makes it fill the screen */
    background-position: center;  /* centers the image */
    background-repeat: no-repeat;
    color: #FFD700;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    margin: 50px 0 20px;
    text-shadow: 2px 2px 8px #000;
  }

  #form {
    margin-bottom: 40px;
  }

  input#gradNumber {
    font-size: 1.3rem;
    padding: 12px 20px;
    width: 220px;
    border-radius: 12px;
    border: 2px solid #FFD700;
    background: #222;
    color: #FFD700;
    text-align: center;
    transition: 0.3s;
  }

  input#gradNumber:focus {
    outline: none;
    box-shadow: 0 0 10px #FFD700;
    border-color: #FFD700;
  }

  button {
    font-size: 1.3rem;
    padding: 12px 30px;
    margin-left: 10px;
    border-radius: 12px;
    border: 2px solid #FFD700;
    background: #222;
    color: #FFD700;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #FFD700;
    color: #1a1a1a;
    transform: scale(1.05);
  }

  #welcomeImage {
    width: 1200px;
    max-width: 90%;
    border-radius: 16px;
    border: 3px solid #FFD700;
    box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    margin-top: 30px;
  }

  #result {
    display: none;
    margin: 50px auto;
    max-width: 700px;
    background: #222;
    padding: 40px 20px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    opacity: 0;
    transform: translateY(50px);
    transition: all 1s ease-out;
  }

  #result.show {
    opacity: 1;
    transform: translateY(0);
  }

  #congrats {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    margin-bottom: 30px;
    text-shadow: 2px 2px 8px #000;
  }

  #photo {
   width: 400px;          /* larger width */
    height: auto;          /* keep aspect ratio, no cropping */
    object-fit: contain;   /* show full image inside box */
    margin: 20px 0;
    border: 5px solid #FFD700;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  .message-box, .verse-box {
    font-size: 1.8rem;
    margin: 20px auto;
    padding: 20px;
    width: 85%;
    max-width: 600px;
    border-radius: 25px;
    background: #1f1f1f;
    border: 2px solid #FFD700;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .verse-box {
    background: #292929;
  }

  canvas#confetti {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 9999;
  }

  @media (max-width: 768px) {
    #photo {
      width: 250px;
      height: 250px;
    }
    #congrats {
      font-size: 2rem;
    }
    .message-box, .verse-box {
      font-size: 1.4rem;
      padding: 15px;
    }
    input#gradNumber, button {
      font-size: 1.1rem;
      padding: 10px 15px;
    }
    #welcomeImage {
      width: 200px;
    }
  }
</style>
</head>
<body>

<h1>Graduation Celebration 🎓</h1>

<div id="form">
  <input type="text" id="gradNumber" placeholder="Enter your graduation number">
  <button onclick="celebrate()">Celebrate!</button>
  <!-- Welcome image -->
  <div>
    <img id="welcomeImage" src="https://raw.githubusercontent.com/AKMF61/med61/refs/heads/main/photo_%D9%A2%D9%A0%D9%A2%D9%A6-%D9%A0%D9%A1-%D9%A2%D9%A6_%D9%A0%D9%A1-%D9%A4%D9%A6-%D9%A0%D9%A9.jpg" alt="Welcome Image">
  </div>
</div>

<div id="result">
  <h2 id="congrats"></h2>
  <img id="photo" src="" alt="Graduate Photo">
  <div class="message-box" id="message"></div>
  <div class="verse-box" id="verse"></div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="confetti"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
let graduates = [];
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv3eBxRi0Cc-uxihd_f-09r4mobnoM88hLNiPccq05WiSnis4pIkV--ajRcoA2g4BgsAlGR8uS5JAd/pub?output=csv";

// Load graduates
Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
        graduates = results.data.map(g => ({
            number: g.number.trim(),
            firstName: g.first_name.trim(),
            image: g.image_url.trim(),
            message: g.message.trim(),
            verse: g.verse.trim()
        }));
        console.log("Graduates loaded:", graduates);
    },
    error: function(err) {
        alert("Failed to load graduation data");
        console.error(err);
    }
});

// Confetti setup
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let confettiPieces = [];
let confettiAnimation;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function createConfetti() {
    confettiPieces = [];
    const colors = ['#FFD700', '#FFC700', '#FFB700', '#FFA500'];
    for (let i = 0; i < 150; i++) {
        confettiPieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: Math.random() * 8 + 4,
            d: Math.random() * 50,
            color: colors[Math.floor(Math.random() * colors.length)],
            tilt: Math.random() * 15,
            tiltAngle: Math.random() * Math.PI
        });
    }
}

function drawConfetti() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiPieces.forEach(p => {
        ctx.beginPath();
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.r / 2;
        ctx.moveTo(p.x + p.tilt, p.y);
        ctx.lineTo(p.x, p.y + p.tilt + p.r);
        ctx.stroke();

        p.tiltAngle += 0.05;
        p.y += Math.cos(p.d) + 2;
        p.x += Math.sin(p.d);
        p.tilt = Math.sin(p.tiltAngle) * 15;

        if(p.y > canvas.height) p.y = -10;
        if(p.x > canvas.width) p.x = 0;
    });
}

function startConfetti() {
    createConfetti();
    confettiAnimation = setInterval(drawConfetti, 20);
}

// Celebrate function
function celebrate() {
    const input = document.getElementById("gradNumber").value.trim();
    const grad = graduates.find(g => g.number === input);
    if(!grad) {
        alert("Graduation number not found ❌");
        return;
    }

    document.getElementById("form").style.display = "none";
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";

    // Trigger fade-in animation
    setTimeout(()=> resultDiv.classList.add("show"), 50);

    document.getElementById("congrats").innerText = `Congratulations, ${grad.firstName}!`;
    document.getElementById("photo").src = grad.image;
    document.getElementById("message").innerText = grad.message;
    document.getElementById("verse").innerText = grad.verse;

    const music = document.getElementById("music");
    music.play();

    startConfetti();
}
</script>
</body>
</html>
